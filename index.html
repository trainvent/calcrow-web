<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Open, edit, preview, and export spreadsheet files with Calcrow.">
  <meta
    name="google-signin-client_id"
    content="743453990456-2vvj52vvip66sd3gpp8h9gd16ljt1vlm.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Calcrow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calcrow</title>
  <link id="app-manifest" rel="manifest" href="manifest.json">
  <script>
    if ((navigator.language || "").toLowerCase().startsWith("de")) {
      document.documentElement.lang = "de";
      document.querySelector('meta[name="description"]').content =
        "Tabellendateien mit Calcrow öffnen, bearbeiten, ansehen und exportieren.";
      document.getElementById("app-manifest").href = "manifest-de.json";
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
